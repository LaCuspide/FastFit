<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar profesionales · FastFit</title>
  <meta name="description" content="Explora personal trainers, nutricionistas, fisioterapeutas, chefs y psicólogos deportivos en Lima.">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="buscar">

  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html" aria-label="FastFit inicio">
        <img class="logo" src="images/logo.png" alt="" onerror="this.style.display='none';this.parentNode.classList.add('no-logo')">
        <span class="name">FastFit</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Abrir menú">☰</button>
      <div class="header-right">
        <nav class="main-nav" aria-label="Principal">
          <a href="buscar.html" data-nav="buscar">Explorar</a>
          <a href="index.html#como-funciona">Cómo funciona</a>
          <a href="index.html#para-profesionales">Para profesionales</a>
          <a href="index.html#ayuda">Ayuda</a>
          <span id="mobile-auth"></span>
        </nav>
        <div class="auth-area" id="auth-area"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero hero-compact">
      <video class="hero-video" autoplay muted loop playsinline preload="auto"><source src="images/hero.mp4" type="video/mp4" onerror="this.parentNode.remove()"></video>
      <h1>Explora profesionales en Lima</h1>
      <div id="search-slot"></div>
    </section>

    <section class="chips-bar" aria-label="Categorías">
      <div class="container"><div class="chips" id="chips"></div></div>
    </section>

    <div class="container">
      <div class="results-layout">
        <aside class="filters" aria-label="Filtros">
          <h2>Filtros</h2>
          <div class="filter-group">
            <label for="f-price">Precio máximo por sesión</label>
            <input type="range" id="f-price" min="50" max="200" step="5" value="200">
            <div class="range-val" id="f-price-val">Hasta S/ 200</div>
          </div>
          <div class="filter-group">
            <label for="f-rating">Calificación mínima</label>
            <select id="f-rating">
              <option value="0">Todas</option>
              <option value="4">4.0 ★ o más</option>
              <option value="4.5">4.5 ★ o más</option>
              <option value="4.8">4.8 ★ o más</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="f-sort">Ordenar por</label>
            <select id="f-sort">
              <option value="rel">Relevancia</option>
              <option value="rating">Mejor calificados</option>
              <option value="price-asc">Precio: menor a mayor</option>
              <option value="price-desc">Precio: mayor a menor</option>
            </select>
          </div>
          <button type="button" class="btn-primary btn-outline" id="f-reset" style="width:100%">Limpiar filtros</button>
        </aside>

        <section aria-label="Resultados">
          <div class="results-head">
            <h2 id="results-title">Todos los profesionales</h2>
            <span class="count" id="count"></span>
          </div>
          <div class="grid-results" id="results"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span><b>FastFit</b> · Marketplace de servicios fitness y bienestar en Lima Metropolitana</span>
      <span>© <span id="footer-year">2026</span> FastFit. Todos los derechos reservados.</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
