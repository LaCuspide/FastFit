<style>

:root {
  --green-header: #17422e;
  --green-band: #15462b;
  --green-title: #255c3a;
  --green-heading: #1a452c;
  --mint: #eff5f3;
  --line: #d7e6e2;
  --ink: #17302c;
  --muted: #566c67;
  --accent: #1f8a70;
  --btn: #0b4f4a;
  --coral: #ff6b4a;
  --peach: #ffa28e;
  --avatar-bg: #e4efec;
  --container: 1240px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Inter", system-ui, sans-serif;
  color: var(--ink);
  background: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; }
a { color: inherit; text-decoration: none; }
button, input, select { font-family: inherit; }
img { max-width: 100%; }
.container { width: 100%; max-width: var(--container); margin: 0 auto; padding: 0 20px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header ---------- */
.site-header { background: var(--green-header); height: 115px; position: relative; z-index: 20; }
.site-header .inner { max-width: 1280px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; padding-right: 61px; position: relative; }
.brand { display: flex; align-items: center; height: 100%; }
.brand .logo { width: 142px; height: 142px; object-fit: cover; margin-top: -9px; align-self: flex-start; }
.brand .logo-fallback { width: 142px; }
.brand .name { font-family: "JetBrains Mono", monospace; font-size: 32px; color: var(--coral); margin-left: -17px; }
.main-nav { display: flex; gap: 36px; font-weight: 500; font-size: 15px; color: var(--peach); }
.main-nav a { padding: 6px 0; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }
.main-nav a:hover, .main-nav a.active { color: #fff; border-color: var(--coral); }
.nav-toggle { display: none; background: none; border: 0; color: var(--peach); font-size: 28px; cursor: pointer; }

/* ---------- Hero ---------- */
.hero { position: relative; background: var(--green-band) center/cover no-repeat; min-height: 283px; padding: 25px 20px 0; text-align: center; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: url("images/hero.jpg") center/cover no-repeat; filter: grayscale(1); opacity: .9; }
.hero > * { position: relative; }
.hero h1 { font-family: "Kumbh Sans", sans-serif; font-weight: 400; font-size: 48px; line-height: 1.2; color: var(--green-title); max-width: 691px; margin: 0 auto; }
.hero p.sub { color: #fff; font-size: 16px; margin: 14px 0 0; }
.hero-compact { min-height: 0; padding: 32px 20px 36px; }
.hero-compact h1 { font-size: 34px; }

/* ---------- Search box ---------- */
.search-box { background: #fff; border-radius: 12px; width: 720px; max-width: 100%; height: 64px; margin: 34px auto 0; padding: 8px; display: flex; align-items: center; gap: 12px; text-align: left; }
.search-field { display: flex; flex-direction: column; justify-content: center; gap: 2px; height: 100%; padding: 8px 16px; flex: 1; min-width: 0; }
.search-field + .search-divider + .search-field { padding-left: 8px; }
.search-field label { font-size: 10px; font-weight: 600; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; }
.search-field select, .search-field input { border: 0; outline: 0; padding: 0; background: transparent; font-size: 14px; font-weight: 500; color: var(--ink); width: 100%; appearance: none; -webkit-appearance: none; cursor: pointer; }
.search-field input { cursor: text; }
.search-divider { width: 1px; height: 40px; background: var(--line); flex-shrink: 0; }
.btn-search { background: var(--coral); color: #fff; border: 0; border-radius: 8px; height: 100%; padding: 0 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: filter .2s; }
.btn-search:hover { filter: brightness(.94); }

/* ---------- Chips ---------- */
.chips-bar { background: var(--mint); padding: 28px 0; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.chip { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 10px 18px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { border-color: var(--accent); }
.chip.active { background: var(--btn); border-color: var(--btn); color: #fff; }

/* ---------- Sections ---------- */
.section { padding: 56px 0 24px; }
.section-title { font-family: "Jura", sans-serif; font-weight: 400; font-size: 40px; color: var(--green-heading); text-decoration: underline; text-underline-position: from-font; margin: 0 0 40px; }
.grid-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }

/* ---------- Card profesional ---------- */
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 230px; transition: box-shadow .2s, transform .2s; }
.card:hover { box-shadow: 0 8px 24px rgba(23, 48, 44, .1); transform: translateY(-2px); }
.avatar { width: 64px; height: 64px; border-radius: 32px; background: var(--avatar-bg); overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--btn); flex-shrink: 0; position: relative; }
.avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.avatar.lg { width: 112px; height: 112px; border-radius: 56px; font-size: 32px; }
.card .name { font-weight: 600; font-size: 17px; margin: 0; }
.card .role { font-weight: 500; font-size: 13px; color: var(--accent); margin: 0; }
.card .rating { font-size: 13px; color: var(--muted); margin: 0; }
.card .zone-tag { font-size: 11px; font-weight: 600; color: var(--btn); background: var(--avatar-bg); padding: 3px 8px; border-radius: 10px; align-self: flex-start; }
.card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.card .price { font-weight: 600; font-size: 14px; }
.btn-primary { background: var(--btn); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-block; transition: filter .2s; }
.btn-primary:hover { filter: brightness(1.15); }
.btn-lg { padding: 14px 28px; font-size: 15px; border-radius: 8px; }
.btn-coral { background: var(--coral); }
.btn-outline { background: #fff; color: var(--btn); border: 1px solid var(--btn); }
.btn-primary[disabled] { opacity: .4; cursor: not-allowed; }

/* ---------- Info sections (home) ---------- */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.step { background: var(--mint); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
.step .num { font-family: "JetBrains Mono", monospace; color: var(--coral); font-size: 28px; }
.step h3 { margin: 8px 0; font-size: 17px; }
.step p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.cta-band { background: var(--green-band); color: #fff; border-radius: 14px; padding: 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.cta-band h3 { margin: 0 0 6px; font-size: 20px; }
.cta-band p { margin: 0; color: #cfe3da; font-size: 14px; }
.faq details { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
.faq summary { font-weight: 600; cursor: pointer; font-size: 15px; }
.faq p { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 10px 0 0; }

/* ---------- Resultados ---------- */
.results-layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; padding: 40px 0 64px; align-items: start; }
.filters { border: 1px solid var(--line); border-radius: 14px; padding: 20px; position: sticky; top: 16px; }
.filters h3 { margin: 0 0 16px; font-size: 15px; }
.filter-group { margin-bottom: 20px; }
.filter-group label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .5px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.filter-group select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: #fff; }
.filter-group input[type=range] { width: 100%; accent-color: var(--btn); }
.range-val { font-size: 13px; font-weight: 600; margin-top: 4px; }
.results-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.results-head h2 { margin: 0; font-family: "Jura", sans-serif; font-weight: 400; font-size: 30px; color: var(--green-heading); }
.results-head .count { color: var(--muted); font-size: 14px; }
.grid-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 48px 24px; text-align: center; color: var(--muted); grid-column: 1 / -1; }

/* ---------- Perfil / reserva / checkout ---------- */
.page-pad { padding: 40px 0 72px; }
.breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.breadcrumb a { color: var(--accent); }
.two-col { display: grid; grid-template-columns: 1fr 360px; gap: 32px; align-items: start; }
.panel { border: 1px solid var(--line); border-radius: 14px; padding: 24px; background: #fff; }
.panel + .panel { margin-top: 20px; }
.panel h2 { margin: 0 0 14px; font-size: 18px; }
.panel h3 { margin: 0 0 10px; font-size: 15px; }
.profile-head { display: flex; gap: 24px; align-items: center; }
.profile-head h1 { margin: 0 0 4px; font-size: 28px; }
.profile-head .role { color: var(--accent); font-weight: 500; }
.profile-head .rating { color: var(--muted); font-size: 14px; margin-top: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { background: var(--mint); border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; font-size: 13px; }
.review { border-top: 1px solid var(--line); padding: 14px 0; font-size: 14px; }
.review:first-of-type { border-top: 0; }
.review b { display: block; margin-bottom: 4px; }
.review span { color: var(--muted); }
.sticky-box { position: sticky; top: 16px; }
.price-big { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
.muted { color: var(--muted); font-size: 13px; }
.summary-row { display: flex; justify-content: space-between; font-size: 14px; padding: 8px 0; }
.summary-row.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; font-weight: 600; font-size: 16px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 24px; }
.day { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 4px; text-align: center; cursor: pointer; transition: all .2s; }
.day small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; }
.day strong { font-size: 18px; }
.day.active { background: var(--btn); border-color: var(--btn); color: #fff; }
.day.active small { color: #cfe3da; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.slot { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; }
.slot:hover:not([disabled]) { border-color: var(--accent); }
.slot.active { background: var(--coral); border-color: var(--coral); color: #fff; }
.slot[disabled] { background: var(--mint); color: #a6b8b3; cursor: not-allowed; text-decoration: line-through; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: 0; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31, 138, 112, .15); }
.field .err { color: #c0392b; font-size: 12px; margin-top: 4px; min-height: 14px; }
.field.invalid input { border-color: #c0392b; }
.pay-methods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.pay-method { border: 1px solid var(--line); border-radius: 10px; padding: 14px 8px; text-align: center; font-size: 14px; font-weight: 500; cursor: pointer; background: #fff; transition: all .2s; }
.pay-method.active { border-color: var(--btn); background: var(--mint); box-shadow: inset 0 0 0 1px var(--btn); }
.confirm-box { max-width: 640px; margin: 0 auto; text-align: center; }
.check { width: 72px; height: 72px; border-radius: 36px; background: var(--accent); color: #fff; font-size: 36px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
.confirm-box h1 { font-family: "Jura", sans-serif; font-weight: 400; font-size: 36px; color: var(--green-heading); margin: 0 0 8px; }
.code { font-family: "JetBrains Mono", monospace; background: var(--mint); border: 1px dashed var(--accent); display: inline-block; padding: 8px 16px; border-radius: 8px; margin: 12px 0 24px; font-size: 18px; }
.confirm-box .panel { text-align: left; margin-bottom: 24px; }
.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ---------- Footer ---------- */
.site-footer { background: var(--green-header); color: #cfe3da; padding: 28px 0; font-size: 13px; margin-top: 40px; }
.site-footer .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.site-footer b { font-family: "JetBrains Mono", monospace; color: var(--coral); font-weight: 400; }

/* ---------- Toast ---------- */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 100; }

/* ---------- Responsive ---------- */
@media (max-width: 1000px) {
  .grid-cards { grid-template-columns: repeat(2, 1fr); }
  .results-layout, .two-col { grid-template-columns: 1fr; }
  .filters, .sticky-box { position: static; }
  .steps { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .site-header .inner { padding-right: 20px; }
  .nav-toggle { display: block; }
  .main-nav { display: none; position: absolute; top: 115px; left: 0; right: 0; background: var(--green-header); flex-direction: column; gap: 0; padding: 12px 20px 20px; }
  .main-nav.open { display: flex; }
  .main-nav a { padding: 12px 0; }
  .hero h1 { font-size: 32px; }
  .section-title { font-size: 30px; }
}
@media (max-width: 640px) {
  .grid-cards, .grid-results { grid-template-columns: 1fr; }
  .search-box { flex-direction: column; height: auto; }
  .search-field { width: 100%; padding: 8px 12px; }
  .search-divider { width: 100%; height: 1px; }
  .btn-search { width: 100%; height: 48px; }
  .days { grid-template-columns: repeat(4, 1fr); }
  .slots { grid-template-columns: repeat(3, 1fr); }
  .form-grid, .pay-methods { grid-template-columns: 1fr; }
  .profile-head { flex-direction: column; text-align: center; }
  .brand .name { font-size: 26px; }
}

.brand.no-logo .name { margin-left: 20px; }

.hero.no-photo h1 { color: #fff; }
.hero > .hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
.video-wrap { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
.video-wrap iframe, .video-wrap video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

</style>
</head>

/* FastFit - lógica de la web (HTML/CSS/JS puro, compatible con GitHub Pages) */
(function () {
  "use strict";

  /* ---------- Utilidades ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  let params = new URLSearchParams("");
  const norm = (s) => (s || "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  const initials = (name) => name.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const money = (n) => "S/ " + Number(n).toFixed(n % 1 ? 2 : 0);
  const roleOf = (p) => (CATEGORIES.find((c) => c.key === p.cat) || {}).role || p.cat;
  const getPro = (id) => PROS.find((p) => p.id === id);
  const store = {
    get: () => { try { return JSON.parse(sessionStorage.getItem("fastfit_booking") || "null"); } catch (e) { return null; } },
    set: (v) => { try { sessionStorage.setItem("fastfit_booking", JSON.stringify(v)); } catch (e) {} },
    clear: () => { try { sessionStorage.removeItem("fastfit_booking"); } catch (e) {} },
  };
  const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const longDate = (isoStr) => {
    const [y, m, d] = isoStr.split("-").map(Number);
    const s = new Date(y, m - 1, d).toLocaleDateString("es-PE", { weekday: "long", day: "numeric", month: "long" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  const hash = (str) => { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; };
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  /* ---------- Componentes compartidos ---------- */
  function renderHeader(active) {
    const links = [
      ["Explorar", "#/buscar", "buscar"],
      ["Cómo funciona", "#/como-funciona", ""],
      ["Para profesionales", "#/para-profesionales", ""],
      ["Ayuda", "#/ayuda", ""],
    ];
    $("#site-header").outerHTML =
      '<header class="site-header"><div class="inner">' +
      '<a class="brand" href="#/" aria-label="FastFit inicio">' +
      '<img class="logo" src="images/logo.png" alt="" onerror="this.style.display=\'none\';this.parentNode.classList.add(\'no-logo\')">' +
      '<span class="name">FastFit</span></a>' +
      '<button class="nav-toggle" aria-label="Abrir menú">☰</button>' +
      '<nav class="main-nav">' +
      links.map((l) => `<a href="${l[1]}" class="${l[2] && l[2] === active ? "active" : ""}">${l[0]}</a>`).join("") +
      "</nav></div></header>";
    $(".nav-toggle").addEventListener("click", () => $(".main-nav").classList.toggle("open"));
  }

  function renderFooter() {
    const el = $("#site-footer");
    if (!el) return;
    el.outerHTML = '<footer class="site-footer"><div class="container"><span><b>FastFit</b> · Marketplace de servicios fitness y bienestar en Lima Metropolitana</span><span>© ' + new Date().getFullYear() + " FastFit. Todos los derechos reservados.</span></div></footer>";
  }

  function videoHTML(url) {
    const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
    if (yt) return `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${yt[1]}" title="Video de presentación" allowfullscreen loading="lazy"></iframe></div>`;
    return `<div class="video-wrap"><video src="${url}" controls playsinline preload="metadata"></video></div>`;
  }

  function avatar(p, large) {
    return `<div class="avatar${large ? " lg" : ""}">${initials(p.name)}${p.img ? `<img src="${p.img}" alt="${p.name}" onerror="this.remove()">` : ""}</div>`;
  }

  function card(p, inZone) {
    return `<article class="card">
      ${avatar(p)}
      <h3 class="name">${p.name}</h3>
      <p class="role">${roleOf(p)}</p>
      <p class="rating">★ ${p.rating.toFixed(1)} (${p.reviews})</p>
      ${inZone ? '<span class="zone-tag">En tu zona</span>' : ""}
      <div class="foot"><span class="price">${money(p.price)} / sesión</span>
      <a class="btn-primary" href="#/perfil?id=${p.id}">Ver perfil</a></div></article>`;
  }

  function searchBox(cat, loc) {
    const opts = CATEGORIES.map((c) => `<option value="${c.key}" ${c.key === cat ? "selected" : ""}>${c.role}</option>`).join("");
    return `<form class="search-box" id="search-form" role="search">
      <div class="search-field"><label for="sb-cat">Qué necesitas</label><select id="sb-cat">${opts}</select></div>
      <div class="search-divider"></div>
      <div class="search-field"><label for="sb-loc">Ubicación</label>
        <input id="sb-loc" list="districts" value="${loc}" autocomplete="off">
        <datalist id="districts">${DISTRICTS.map((d) => `<option value="${d}, Lima">`).join("")}</datalist></div>
      <button class="btn-search" type="submit">Buscar</button></form>`;
  }

  function bindSearch() {
    $("#search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = new URLSearchParams({ cat: $("#sb-cat").value, loc: $("#sb-loc").value.trim() });
      location.href = "#/buscar?" + q.toString();
    });
  }

  function chipsHTML(active, withAll) {
    const all = withAll ? `<button class="chip ${active === "" ? "active" : ""}" data-cat="">Todos</button>` : "";
    return all + CATEGORIES.map((c) => `<button class="chip ${active === c.key ? "active" : ""}" data-cat="${c.key}">${c.key}</button>`).join("");
  }

  /* ---------- HOME ---------- */
  function initHome() {
    renderHeader("");
    $("#search-slot").innerHTML = searchBox("Personal Trainers", "San Borja, Lima");
    bindSearch();
    $("#chips").innerHTML = chipsHTML("", false);
    $$("#chips .chip").forEach((b) => b.addEventListener("click", () => {
      location.href = "#/buscar?cat=" + encodeURIComponent(b.dataset.cat);
    }));
    $("#featured").innerHTML = PROS.slice(0, 3).map((p) => card(p)).join("");
  }

  /* ---------- BUSCAR ---------- */
  function initBuscar() {
    renderHeader("buscar");
    const state = {
      cat: params.get("cat") || "",
      loc: params.get("loc") || "San Borja, Lima",
      max: 200, minRating: 0, sort: "rel",
    };
    if (state.cat && !CATEGORIES.some((c) => c.key === state.cat)) state.cat = "";

    $("#search-slot").innerHTML = searchBox(state.cat || "Personal Trainers", state.loc);
    bindSearch();

    function paintChips() {
      $("#chips").innerHTML = chipsHTML(state.cat, true);
      $$("#chips .chip").forEach((b) => b.addEventListener("click", () => { state.cat = b.dataset.cat; paintChips(); paintResults(); }));
    }

    function paintResults() {
      const locPart = norm(state.loc.split(",")[0]);
      let list = PROS.filter((p) => (!state.cat || p.cat === state.cat) && p.price <= state.max && p.rating >= state.minRating)
        .map((p) => ({ p, zone: !!locPart && norm(p.zone).includes(locPart) }));
      list.sort((a, b) => {
        if (state.sort === "rating") return b.p.rating - a.p.rating;
        if (state.sort === "price-asc") return a.p.price - b.p.price;
        if (state.sort === "price-desc") return b.p.price - a.p.price;
        return (b.zone - a.zone) || (b.p.rating - a.p.rating);
      });
      $("#count").textContent = list.length + (list.length === 1 ? " profesional encontrado" : " profesionales encontrados");
      $("#results-title").textContent = state.cat || "Todos los profesionales";
      $("#results").innerHTML = list.length
        ? list.map((x) => card(x.p, x.zone)).join("")
        : '<div class="empty"><b>No encontramos resultados</b><br>Prueba ampliando el precio o quitando algún filtro.</div>';
    }

    $("#f-price").addEventListener("input", (e) => { state.max = +e.target.value; $("#f-price-val").textContent = "Hasta " + money(state.max); paintResults(); });
    $("#f-rating").addEventListener("change", (e) => { state.minRating = +e.target.value; paintResults(); });
    $("#f-sort").addEventListener("change", (e) => { state.sort = e.target.value; paintResults(); });
    $("#f-reset").addEventListener("click", () => {
      state.max = 200; state.minRating = 0; state.sort = "rel";
      $("#f-price").value = 200; $("#f-price-val").textContent = "Hasta S/ 200";
      $("#f-rating").value = 0; $("#f-sort").value = "rel"; paintResults();
    });

    paintChips(); paintResults();
  }

  /* ---------- PERFIL ---------- */
  function initPerfil() {
    renderHeader("buscar");
    const p = getPro(params.get("id"));
    const root = $("#profile-root");
    if (!p) {
      root.innerHTML = '<div class="empty">Profesional no encontrado. <a href="#/buscar" style="color:var(--accent);font-weight:600">Volver a explorar</a></div>';
      return;
    }
    document.title = p.name + " · FastFit";
    root.innerHTML = `
      <div class="breadcrumb"><a href="#/">Inicio</a> / <a href="#/buscar?cat=${encodeURIComponent(p.cat)}">${p.cat}</a> / ${p.name}</div>
      <div class="two-col">
        <div>
          <div class="panel"><div class="profile-head">${avatar(p, true)}
            <div><h1>${p.name}</h1><div class="role">${roleOf(p)}</div>
            <div class="rating">★ ${p.rating.toFixed(1)} (${p.reviews} reseñas) · ${p.zone}, Lima</div></div></div></div>
          <div class="panel"><h2>Sobre mí</h2><p style="line-height:1.6;color:var(--muted);margin:0">${p.bio}</p></div>
          ${p.video ? '<div class="panel"><h2>Video de presentación</h2>' + videoHTML(p.video) + "</div>" : ""}
          <div class="panel"><h2>Servicios</h2><div class="tags">${p.services.map((s) => `<span class="tag">${s}</span>`).join("")}</div></div>
          <div class="panel"><h2>Reseñas</h2>${REVIEWS.map((r) => `<div class="review"><b>${r.who} <span>★ 5.0</span></b>${r.text}</div>`).join("")}</div>
        </div>
        <aside class="sticky-box"><div class="panel">
          <p class="price-big">${money(p.price)} <span class="muted">/ sesión</span></p>
          <p class="muted" style="margin:0 0 18px">Sesión de 60 min · Cancelación gratuita hasta 24 h antes</p>
          <a class="btn-primary btn-coral btn-lg" style="display:block;text-align:center" href="#/horario?id=${p.id}">Reservar sesión</a>
        </div></aside>
      </div>`;
  }

  /* ---------- HORARIO ---------- */
  function initHorario() {
    renderHeader("buscar");
    const p = getPro(params.get("id"));
    const root = $("#schedule-root");
    if (!p) { root.innerHTML = '<div class="empty">Profesional no encontrado. <a href="#/buscar" style="color:var(--accent);font-weight:600">Volver a explorar</a></div>'; return; }

    const HOURS = [7, 8, 9, 10, 11, 12, 15, 16, 17, 18, 19, 20];
    const today = new Date();
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i); return d; });
    let selDay = 0, selTime = null;

    function isFree(d, h) {
      if (iso(d) === iso(today) && h <= today.getHours()) return false;
      return hash(p.id + iso(d) + h) % 4 !== 0; // disponibilidad de ejemplo
    }

    root.innerHTML = `
      <div class="breadcrumb"><a href="#/">Inicio</a> / <a href="#/perfil?id=${p.id}">${p.name}</a> / Selecciona horario</div>
      <div class="two-col">
        <div class="panel"><h2>Elige día y hora</h2><div class="days" id="days"></div><h3>Horarios disponibles</h3><div class="slots" id="slots"></div></div>
        <aside class="sticky-box"><div class="panel">
          <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">${avatar(p)}<div><b>${p.name}</b><div class="muted">${roleOf(p)}</div></div></div>
          <div class="summary-row"><span>Fecha</span><span id="sum-date">—</span></div>
          <div class="summary-row"><span>Hora</span><span id="sum-time">—</span></div>
          <div class="summary-row"><span>Duración</span><span>60 min</span></div>
          <div class="summary-row total"><span>Total</span><span>${money(p.price)}</span></div>
          <button class="btn-primary btn-coral btn-lg" id="go" style="width:100%;margin-top:16px" disabled>Continuar al pago</button>
        </div></aside>
      </div>`;

    function paintDays() {
      $("#days").innerHTML = days.map((d, i) => `<button class="day ${i === selDay ? "active" : ""}" data-i="${i}"><small>${d.toLocaleDateString("es-PE", { weekday: "short" }).replace(".", "")}</small><strong>${d.getDate()}</strong></button>`).join("");
      $$("#days .day").forEach((b) => b.addEventListener("click", () => { selDay = +b.dataset.i; selTime = null; paintDays(); paintSlots(); paintSummary(); }));
    }
    function paintSlots() {
      $("#slots").innerHTML = HOURS.map((h) => {
        const free = isFree(days[selDay], h);
        return `<button class="slot ${selTime === h ? "active" : ""}" data-h="${h}" ${free ? "" : "disabled"}>${String(h).padStart(2, "0")}:00</button>`;
      }).join("");
      $$("#slots .slot:not([disabled])").forEach((b) => b.addEventListener("click", () => { selTime = +b.dataset.h; paintSlots(); paintSummary(); }));
    }
    function paintSummary() {
      $("#sum-date").textContent = longDate(iso(days[selDay]));
      $("#sum-time").textContent = selTime === null ? "—" : String(selTime).padStart(2, "0") + ":00";
      $("#go").disabled = selTime === null;
    }
    $("#go").addEventListener("click", () => {
      if (selTime === null) return;
      store.set({ proId: p.id, date: iso(days[selDay]), hour: selTime });
      location.href = "#/checkout";
    });
    paintDays(); paintSlots(); paintSummary();
  }

  /* ---------- CHECKOUT ---------- */
  function initCheckout() {
    renderHeader("buscar");
    const b = store.get();
    const p = b && getPro(b.proId);
    const root = $("#checkout-root");
    if (!b || !p) { root.innerHTML = '<div class="empty">No hay una reserva en curso. <a href="#/buscar" style="color:var(--accent);font-weight:600">Buscar profesional</a></div>'; return; }

    const fee = Math.round(p.price * 0.1 * 100) / 100;
    const total = p.price + fee;
    let method = "card";

    root.innerHTML = `
      <div class="breadcrumb"><a href="#/">Inicio</a> / <a href="#/horario?id=${p.id}">Horario</a> / Pago</div>
      <div class="two-col">
        <form id="pay-form" class="panel" novalidate>

          </div>
          <h2 style="margin-top:28px">Método de pago</h2>
          <div class="pay-methods">
            <button type="button" class="pay-method active" data-m="card">Tarjeta</button>
            <button type="button" class="pay-method" data-m="yape">Yape</button>
            <button type="button" class="pay-method" data-m="plin">Plin</button>
          </div>
          <div id="card-fields" class="form-grid">
            <div class="field full"><label for="f-card">Número de tarjeta</label><input id="f-card" inputmode="numeric" maxlength="19" placeholder="0000 0000 0000 0000" autocomplete="cc-number"><div class="err"></div></div>
            <div class="field"><label for="f-exp">Vencimiento</label><input id="f-exp" maxlength="5" placeholder="MM/AA" autocomplete="cc-exp"><div class="err"></div></div>
            <div class="field"><label for="f-cvv">CVV</label><input id="f-cvv" inputmode="numeric" maxlength="4" placeholder="123" autocomplete="cc-csc"><div class="err"></div></div>
          </div>
          <p id="wallet-note" class="muted" style="display:none;line-height:1.5">Al confirmar te mostraremos las instrucciones para completar el pago desde tu app.</p>
          <button class="btn-primary btn-coral btn-lg" type="submit" style="width:100%;margin-top:24px">Pagar ${money(total)}</button>
        </form>
        <aside class="sticky-box"><div class="panel">
          <h2>Resumen</h2>
          <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${avatar(p)}<div><b>${p.name}</b><div class="muted">${roleOf(p)}</div></div></div>
          <div class="summary-row"><span>Fecha</span><span>${longDate(b.date)}</span></div>
          <div class="summary-row"><span>Hora</span><span>${String(b.hour).padStart(2, "0")}:00</span></div>
          <div class="summary-row"><span>Sesión (60 min)</span><span>${money(p.price)}</span></div>
          <div class="summary-row"><span>Tarifa de servicio (10%)</span><span>${money(fee)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${money(total)}</span></div>
        </div></aside>
      </div>`;

    const setErr = (id, msg) => {
      const f = $("#" + id).closest(".field"); f.classList.toggle("invalid", !!msg); $(".err", f).textContent = msg || "";
      return !msg;
    };
    $$(".pay-method").forEach((btn) => btn.addEventListener("click", () => {
      method = btn.dataset.m;

      ok = setErr("f-phone", /^9\d{8}$/.test(phone) ? "" : "Celular de 9 dígitos que empiece con 9") && ok;
      if (method === "card") {
        const num = $("#f-card").value.replace(/\s/g, ""), exp = $("#f-exp").value, cvv = $("#f-cvv").value;
        ok = setErr("f-card", /^\d{16}$/.test(num) ? "" : "Ingresa los 16 dígitos") && ok;
        const m = exp.match(/^(\d{2})\/(\d{2})$/);
        const now = new Date();
        const valid = m && +m[1] >= 1 && +m[1] <= 12 && new Date(2000 + +m[2], +m[1], 0, 23, 59) >= now;
        ok = setErr("f-exp", valid ? "" : "Fecha inválida o vencida") && ok;
        ok = setErr("f-cvv", /^\d{3,4}$/.test(cvv) ? "" : "CVV inválido") && ok;
      }
      if (!ok) return;
      // Pago SIMULADO: aquí integrarías tu pasarela (Culqi, Izipay, Niubiz, etc.). No se guardan datos de tarjeta.
      const code = "FF-" + Math.random().toString(36).slice(2, 8).toUpperCase();
      store.set({ ...b, name, email, phone, method, total, code });
      location.href = "#/confirmacion";
    });
  }

  /* ---------- CONFIRMACIÓN ---------- */
  function initConfirmacion() {
    renderHeader("");
    const b = store.get();
    const p = b && getPro(b.proId);
    const root = $("#confirm-root");
    if (!b || !p || !b.code) { root.innerHTML = '<div class="empty">No hay una reserva confirmada. <a href="#/" style="color:var(--accent);font-weight:600">Ir al inicio</a></div>'; return; }
    const methods = { card: "Tarjeta", yape: "Yape", plin: "Plin" };
    root.innerHTML = `<div class="confirm-box">
      <div class="check">✓</div><h1>¡Reserva confirmada!</h1>
      <p class="muted" style="font-size:15px">Enviamos los detalles a ${b.email}</p>
      <div class="code">${b.code}</div>
      <div class="panel">
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${avatar(p)}<div><b>${p.name}</b><div class="muted">${roleOf(p)}</div></div></div>
        <div class="summary-row"><span>Fecha</span><span>${longDate(b.date)}</span></div>
        <div class="summary-row"><span>Hora</span><span>${String(b.hour).padStart(2, "0")}:00 (60 min)</span></div>
        <div class="summary-row"><span>Método de pago</span><span>${methods[b.method]}</span></div>
        <div class="summary-row total"><span>Total</span><span>${money(b.total)}</span></div>
      </div>
      <div class="actions">
        <button class="btn-primary btn-lg btn-outline" id="ics">Agregar al calendario</button>
        <a class="btn-primary btn-lg btn-coral" id="home" href="#/">Volver al inicio</a>
      </div></div>`;
    $("#home").addEventListener("click", () => store.clear());
    $("#ics").addEventListener("click", () => {
      const [y, m, d] = b.date.split("-").map(Number);
      const fmt = (h) => `${y}${String(m).padStart(2, "0")}${String(d).padStart(2, "0")}T${String(h).padStart(2, "0")}0000`;
      const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FastFit//ES", "BEGIN:VEVENT", "UID:" + b.code + "@fastfit",
        "DTSTAMP:" + fmt(new Date().getHours()), "DTSTART:" + fmt(b.hour), "DTEND:" + fmt(b.hour + 1),
        "SUMMARY:Sesión FastFit con " + p.name, "DESCRIPTION:Código de reserva " + b.code, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
      a.download = "fastfit-" + b.code + ".ics"; a.click(); URL.revokeObjectURL(a.href);
      toast("Evento descargado");
    });
  }

  /* ---------- Router (una sola página, rutas con #) ---------- */
  const INITS = { home: initHome, buscar: initBuscar, perfil: initPerfil, horario: initHorario, checkout: initCheckout, confirmacion: initConfirmacion };
  const SECTIONS = { "como-funciona": 1, "para-profesionales": 1, "ayuda": 1 };
  function route() {
    const raw = location.hash.replace(/^#\/?/, "");
    const parts = raw.split("?");
    const path = parts[0];
    params = new URLSearchParams(parts[1] || "");
    let page = INITS[path] ? path : "home";
    const section = SECTIONS[path] ? path : null;
    $("#app").innerHTML = '<div id="site-header"></div>' + PAGE_HTML[page] + '<div id="site-footer"></div>';
    INITS[page]();
    renderFooter();
    const heroImg = new Image();
    heroImg.onerror = () => { const h = $(".hero"); if (h) h.classList.add("no-photo"); };
    heroImg.src = "images/hero.jpg";
    if (section) { const el = document.getElementById(section); if (el) el.scrollIntoView(); } else window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
